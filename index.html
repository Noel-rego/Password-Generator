<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Password Generator</title>
</head>
<body>
    <head></head>
    <main>
        <div>Password Generator</div>
        <div class="first">
            <div>erg241</div>
            <!-- icon-->
        </div>
        <div class="second">
            <div class="charlendiv"> Character Lenght
                <input class="charlen" type="number" placeholder="">
            </div>
            <form>
                <input type="checkbox" id="upper" value="1" name="upper" >
                 <label for="upper">Include Uppercase Letters</label>
                <input type="checkbox" id="lower" value="2" name="lower" >
                 <label for="lower">Include Lowercase Letters</label>
                <input type="checkbox"  id="number" value="3" name="number" >
                 <label for="number">Include Numbers</label>
                <input type="checkbox"  id="symbol" value="4" name="symbol" > 
                 <label for="symbol">Include Symbols</label>
            </form>
            <div class="strengthdiv">
                <div class="strenght">STRENGTH         
                    <div>medium</div>
                    <!-- icon-->
                </div>
            </div>
            <button id="generate" class="generate">GENERATE -></button>

        </div>

    </main>
    <footer></footer>
    <script src="first.js"></script>
</body>
</html>
